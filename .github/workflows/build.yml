name: Compiler MindFilter
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: { group: apk, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraire les sources
        run: |
          if [ -f MindFilter-sources.zip ]; then
            unzip -o -q MindFilter-sources.zip && git rm -q MindFilter-sources.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A && git commit -q -m "Sources de MindFilter extraites" && git push
          fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.3 }
      - name: Compiler
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" > /dev/null
          base64 -d keystore/mindfilter-debug.jks.b64 > keystore/mindfilter-debug.jks
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk MindFilter-v0.1.apk
          ls -l MindFilter-v0.1.apk
      - uses: actions/upload-artifact@v4
        with: { name: MindFilter-v0.1, path: MindFilter-v0.1.apk }
      - name: Publier
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete v0.1 --cleanup-tag -y || true
          gh release create v0.1 MindFilter-v0.1.apk -t "MindFilter 0.1" -n "APK compilé par GitHub Actions (exécution ${{ github.run_number }})"
      - name: Signaler un échec
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          touch build.log
          (echo '```'; grep -E "^e: |error:|FAILED|What went wrong|Could not" build.log | head -60; echo '...'; tail -40 build.log; echo '```') > issue.md
          gh issue create -t "Échec de compilation ${{ github.run_number }}" -F issue.md
